<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <style>
      @keyframes cursorClick {
        0%, 100% { transform: translate(235px, 42px) scale(1); }
        38% { transform: translate(230px, 36px) scale(1); }
        46% { transform: translate(228px, 34px) scale(0.85); }
        54% { transform: translate(230px, 36px) scale(1); }
      }
      @keyframes btnTap {
        0%, 100% { transform: scale(1); }
        46% { transform: scale(0.97); }
        54% { transform: scale(1); }
      }
      @keyframes bellWiggle {
        0%, 42%, 68%, 100% { transform: translate(225px, 33px) rotate(0deg); }
        46% { transform: translate(225px, 33px) rotate(-20deg); }
        50% { transform: translate(225px, 33px) rotate(20deg); }
        54% { transform: translate(225px, 33px) rotate(-14deg); }
        58% { transform: translate(225px, 33px) rotate(10deg); }
        62% { transform: translate(225px, 33px) rotate(-4deg); }
      }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px currentColor); }
        50% { opacity: 1; filter: drop-shadow(0 0 26px currentColor); }
      }
      @keyframes floatGently {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes eqBounce1 { 0%, 100% { height: 25px; y: -25px; } 50% { height: 75px; y: -75px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 65px; y: -65px; } 50% { height: 20px; y: -20px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 35px; y: -35px; } 50% { height: 85px; y: -85px; } }
      @keyframes glitchTwitch {
        0%, 88%, 100% { transform: translate(0, 0); }
        90% { transform: translate(-6px, 2px); }
        93% { transform: translate(5px, -2px); }
        96% { transform: translate(-2px, 1px); }
      }
      .anim-cursor { animation: cursorClick 2.6s ease-in-out infinite; transform-origin: 0 0; }
      .anim-btn { animation: btnTap 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-bell { animation: bellWiggle 2.6s ease-in-out infinite; transform-origin: 0 -12px; }
      .anim-glow { animation: neonGlow 2.2s ease-in-out infinite; }
      .anim-float { animation: floatGently 3.5s ease-in-out infinite; }
      .anim-eq1 { animation: eqBounce1 0.8s ease-in-out infinite; }
      .anim-eq2 { animation: eqBounce2 1.1s ease-in-out infinite; }
      .anim-eq3 { animation: eqBounce3 0.9s ease-in-out infinite; }
      .anim-glitch { animation: glitchTwitch 3.5s step-end infinite; }
    </style>
    <linearGradient id="bg-podcast-mindful" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="50%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    
  </defs>

  <rect width="2560" height="1440" fill="url(#bg-podcast-mindful)" />
  
      <ellipse cx="600" cy="500" rx="700" ry="500" fill="#0D9488" opacity="0.22" />
      <ellipse cx="1400" cy="900" rx="600" ry="700" fill="#0D9488" opacity="0.16" />
      <circle cx="2000" cy="400" r="500" fill="#0D9488" opacity="0.25" />
      <circle cx="120" cy="120" r="6" fill="#0D9488" opacity="0.35" /><circle cx="1621" cy="249" r="21" fill="#0D9488" opacity="0.35" /><circle cx="802" cy="378" r="18" fill="#0D9488" opacity="0.35" /><circle cx="2303" cy="507" r="15" fill="#0D9488" opacity="0.35" /><circle cx="1484" cy="636" r="12" fill="#0D9488" opacity="0.35" /><circle cx="665" cy="765" r="9" fill="#0D9488" opacity="0.35" /><circle cx="2166" cy="894" r="6" fill="#0D9488" opacity="0.35" /><circle cx="1347" cy="1023" r="21" fill="#0D9488" opacity="0.35" /><circle cx="528" cy="1152" r="18" fill="#0D9488" opacity="0.35" /><circle cx="2029" cy="1281" r="15" fill="#0D9488" opacity="0.35" /><circle cx="1210" cy="210" r="12" fill="#0D9488" opacity="0.35" /><circle cx="391" cy="339" r="9" fill="#0D9488" opacity="0.35" /><circle cx="1892" cy="468" r="6" fill="#0D9488" opacity="0.35" /><circle cx="1073" cy="597" r="21" fill="#0D9488" opacity="0.35" />

      <!-- Prominent Floral Circular Photo Frame -->
      
    <g transform="translate(680, 720)">
      <defs>
        <clipPath id="av-clip-podcast-mindful">
          <circle cx="0" cy="0" r="203" />
        </clipPath>
        <radialGradient id="av-grad-podcast-mindful" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#E2E8F0" />
        </radialGradient>
      </defs>

      <!-- Frame Outer Drop Shadow & Ring -->
      <circle cx="0" cy="0" r="210" fill="none" stroke="#FFFFFF" stroke-width="14" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.32))" />

      <!-- Clipped Portrait -->
      <g clip-path="url(#av-clip-podcast-mindful)">
        <!-- Studio Background -->
        <rect x="-210" y="-210" width="420" height="420" fill="url(#av-grad-podcast-mindful)" />

        <!-- Torso / Shoulders -->
        <path d="M -193.20000000000002 210 C -157.5 63, -63 25.2, 0 33.6 C 63 25.2, 157.5 63, 193.20000000000002 210 Z" fill="#18181B" />

        <!-- Collar / Neck -->
        <path d="M -46.2 37.8 L 0 75.6 L 46.2 37.8 L 37.8 -10.5 L -37.8 -10.5 Z" fill="#D18E66" />

        <!-- Head / Face -->
        <ellipse cx="0" cy="-25.2" rx="73.5" ry="92.4" fill="#D18E66" />

        <!-- Hair -->
        <path d="M -79.8 -31.5 C -92.4 -136.5, 92.4 -136.5, 79.8 -31.5 C 71.4 -105, -71.4 -105, -79.8 -31.5 Z" fill="#A35223" />
        <ellipse cx="0" cy="-88.2" rx="71.4" ry="46.2" fill="#A35223" />

        <!-- Eyes -->
        <ellipse cx="-27.3" cy="-29.400000000000002" rx="7.9799999999999995" ry="10.08" fill="#0F172A" />
        <ellipse cx="27.3" cy="-29.400000000000002" rx="7.9799999999999995" ry="10.08" fill="#0F172A" />

        <!-- Friendly Smile -->
        <path d="M -27.3 14.700000000000001 Q 0 35.7 27.3 14.700000000000001" fill="none" stroke="#78350F" stroke-width="5.04" stroke-linecap="round" />

        
      </g>
    </g>
  

      <!-- Center-Right Elegant Serif Type -->
      <g transform="translate(1000, 720)">
        <text x="0" y="-40" fill="#042F2E" font-family="Georgia, serif" font-size="115" font-weight="bold">QUIET CLARITY</text>
        <text x="0" y="30" fill="#042F2E" font-family="Georgia, serif" font-size="38" font-style="italic">Daily Mindfulness · Breathwork &amp; Emotional Resilience</text>
        <g transform="translate(0, 70)">
          
    <g transform="translate(0, 0) scale(0.95)">
      <!-- Subscribe Pill Button with Tap Animation -->
      <g class="anim-btn">
        <rect width="280" height="66" rx="33" fill="#0D9488" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.32))" />
        <text x="116" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5px" text-anchor="middle">SUBSCRIBE</text>
      </g>

      <!-- Ringing Notification Bell -->
      <g class="anim-bell" transform="translate(225, 33)">
        <path d="M 0 -13 C -5 -13, -8 -8, -8 0 L -11 9 L 11 9 L 8 0 C 8 -8, 5 -13, 0 -13 Z" fill="#FFFFFF" />
        <circle cx="0" cy="12" r="3" fill="#FFFFFF" />
      </g>

      <!-- Animated Clicking Pointer Hand Cursor -->
      <g class="anim-cursor" transform="translate(235, 42)">
        <path d="M 0 0 L 0 28 L 7 21 L 13 33 L 18 30 L 12 18 L 20 18 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.45))" />
      </g>
    </g>
  
        </g>
      </g>
    
</svg>
