<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <style>
      @keyframes cursorClick {
        0%, 100% { transform: translate(235px, 42px) scale(1); }
        38% { transform: translate(230px, 36px) scale(1); }
        46% { transform: translate(228px, 34px) scale(0.85); }
        54% { transform: translate(230px, 36px) scale(1); }
      }
      @keyframes btnTap {
        0%, 100% { transform: scale(1); }
        46% { transform: scale(0.97); }
        54% { transform: scale(1); }
      }
      @keyframes bellWiggle {
        0%, 42%, 68%, 100% { transform: translate(225px, 33px) rotate(0deg); }
        46% { transform: translate(225px, 33px) rotate(-20deg); }
        50% { transform: translate(225px, 33px) rotate(20deg); }
        54% { transform: translate(225px, 33px) rotate(-14deg); }
        58% { transform: translate(225px, 33px) rotate(10deg); }
        62% { transform: translate(225px, 33px) rotate(-4deg); }
      }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px currentColor); }
        50% { opacity: 1; filter: drop-shadow(0 0 26px currentColor); }
      }
      @keyframes floatGently {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes eqBounce1 { 0%, 100% { height: 25px; y: -25px; } 50% { height: 75px; y: -75px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 65px; y: -65px; } 50% { height: 20px; y: -20px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 35px; y: -35px; } 50% { height: 85px; y: -85px; } }
      @keyframes glitchTwitch {
        0%, 88%, 100% { transform: translate(0, 0); }
        90% { transform: translate(-6px, 2px); }
        93% { transform: translate(5px, -2px); }
        96% { transform: translate(-2px, 1px); }
      }
      .anim-cursor { animation: cursorClick 2.6s ease-in-out infinite; transform-origin: 0 0; }
      .anim-btn { animation: btnTap 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-bell { animation: bellWiggle 2.6s ease-in-out infinite; transform-origin: 0 -12px; }
      .anim-glow { animation: neonGlow 2.2s ease-in-out infinite; }
      .anim-float { animation: floatGently 3.5s ease-in-out infinite; }
      .anim-eq1 { animation: eqBounce1 0.8s ease-in-out infinite; }
      .anim-eq2 { animation: eqBounce2 1.1s ease-in-out infinite; }
      .anim-eq3 { animation: eqBounce3 0.9s ease-in-out infinite; }
      .anim-glitch { animation: glitchTwitch 3.5s step-end infinite; }
    </style>
    <linearGradient id="bg-gaming-scifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="50%" stop-color="#0B0B1A" />
      <stop offset="100%" stop-color="#14142B" />
    </linearGradient>
    
      <filter id="glow-gaming-scifi">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <pattern id="scanlines-gaming-scifi" width="4" height="8" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="4" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.05" />
      </pattern>
    
  </defs>

  <rect width="2560" height="1440" fill="url(#bg-gaming-scifi)" />
  
      <line x1="0" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="128" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="256" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="384" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="512" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="640" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="768" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="896" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1024" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1152" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1280" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1408" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1536" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1664" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1792" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="1920" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="2048" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="2176" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="2304" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="2432" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="2560" y1="1440" x2="1280" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="720" x2="2560" y2="720" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="800" x2="2560" y2="800" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="880" x2="2560" y2="880" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="960" x2="2560" y2="960" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1040" x2="2560" y2="1040" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1120" x2="2560" y2="1120" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1200" x2="2560" y2="1200" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1280" x2="2560" y2="1280" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1360" x2="2560" y2="1360" stroke="#00F0FF" stroke-width="1" opacity="0.32" /><line x1="0" y1="1440" x2="2560" y2="1440" stroke="#00F0FF" stroke-width="1" opacity="0.32" />
      <!-- Pulsing Neon Outer Frame -->
      <rect class="anim-glow" x="100" y="100" width="2360" height="1240" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#glow-gaming-scifi)" />
      <path d="M 80 120 L 80 80 L 120 80" fill="none" stroke="#00F0FF" stroke-width="6" />
      <path d="M 2480 120 L 2480 80 L 2440 80" fill="none" stroke="#00F0FF" stroke-width="6" />
      <path d="M 80 1320 L 80 1360 L 120 1360" fill="none" stroke="#00F0FF" stroke-width="6" />
      <path d="M 2480 1320 L 2480 1360 L 2440 1360" fill="none" stroke="#00F0FF" stroke-width="6" />

      <!-- Glowing Center Typography -->
      <text class="anim-glow" x="1280" y="660" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="135" font-weight="900" text-anchor="middle" filter="url(#glow-gaming-scifi)">ORBITAL PROTOCOL</text>
      <text x="1280" y="760" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="38" text-anchor="middle">DEEP SPACE EXPLORATION &amp; MECHA WARFARE</text>

      <g transform="translate(1140, 830)">
        
    <g transform="translate(0, 0) scale(0.95)">
      <!-- Subscribe Pill Button with Tap Animation -->
      <g class="anim-btn">
        <rect width="280" height="66" rx="33" fill="#00F0FF" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.32))" />
        <text x="116" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5px" text-anchor="middle">SUBSCRIBE</text>
      </g>

      <!-- Ringing Notification Bell -->
      <g class="anim-bell" transform="translate(225, 33)">
        <path d="M 0 -13 C -5 -13, -8 -8, -8 0 L -11 9 L 11 9 L 8 0 C 8 -8, 5 -13, 0 -13 Z" fill="#FFFFFF" />
        <circle cx="0" cy="12" r="3" fill="#FFFFFF" />
      </g>

      <!-- Animated Clicking Pointer Hand Cursor -->
      <g class="anim-cursor" transform="translate(235, 42)">
        <path d="M 0 0 L 0 28 L 7 21 L 13 33 L 18 30 L 12 18 L 20 18 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.45))" />
      </g>
    </g>
  
      </g>

      <rect width="2560" height="1440" fill="url(#scanlines-gaming-scifi)" pointer-events="none" />
    
</svg>
