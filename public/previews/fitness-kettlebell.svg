<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <style>
      @keyframes cursorClick {
        0%, 100% { transform: translate(235px, 42px) scale(1); }
        38% { transform: translate(230px, 36px) scale(1); }
        46% { transform: translate(228px, 34px) scale(0.85); }
        54% { transform: translate(230px, 36px) scale(1); }
      }
      @keyframes btnTap {
        0%, 100% { transform: scale(1); }
        46% { transform: scale(0.97); }
        54% { transform: scale(1); }
      }
      @keyframes bellWiggle {
        0%, 42%, 68%, 100% { transform: translate(225px, 33px) rotate(0deg); }
        46% { transform: translate(225px, 33px) rotate(-20deg); }
        50% { transform: translate(225px, 33px) rotate(20deg); }
        54% { transform: translate(225px, 33px) rotate(-14deg); }
        58% { transform: translate(225px, 33px) rotate(10deg); }
        62% { transform: translate(225px, 33px) rotate(-4deg); }
      }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px currentColor); }
        50% { opacity: 1; filter: drop-shadow(0 0 26px currentColor); }
      }
      @keyframes floatGently {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes eqBounce1 { 0%, 100% { height: 25px; y: -25px; } 50% { height: 75px; y: -75px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 65px; y: -65px; } 50% { height: 20px; y: -20px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 35px; y: -35px; } 50% { height: 85px; y: -85px; } }
      @keyframes glitchTwitch {
        0%, 88%, 100% { transform: translate(0, 0); }
        90% { transform: translate(-6px, 2px); }
        93% { transform: translate(5px, -2px); }
        96% { transform: translate(-2px, 1px); }
      }
      .anim-cursor { animation: cursorClick 2.6s ease-in-out infinite; transform-origin: 0 0; }
      .anim-btn { animation: btnTap 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-bell { animation: bellWiggle 2.6s ease-in-out infinite; transform-origin: 0 -12px; }
      .anim-glow { animation: neonGlow 2.2s ease-in-out infinite; }
      .anim-float { animation: floatGently 3.5s ease-in-out infinite; }
      .anim-eq1 { animation: eqBounce1 0.8s ease-in-out infinite; }
      .anim-eq2 { animation: eqBounce2 1.1s ease-in-out infinite; }
      .anim-eq3 { animation: eqBounce3 0.9s ease-in-out infinite; }
      .anim-glitch { animation: glitchTwitch 3.5s step-end infinite; }
    </style>
    <linearGradient id="bg-fitness-kettlebell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    
  </defs>

  <rect width="2560" height="1440" fill="url(#bg-fitness-kettlebell)" />
  
      <line x1="0" y1="0" x2="2560" y2="-1280" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="80" x2="2560" y2="-1200" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="160" x2="2560" y2="-1120" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="240" x2="2560" y2="-1040" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="320" x2="2560" y2="-960" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="400" x2="2560" y2="-880" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="480" x2="2560" y2="-800" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="560" x2="2560" y2="-720" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="640" x2="2560" y2="-640" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="720" x2="2560" y2="-560" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="800" x2="2560" y2="-480" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="880" x2="2560" y2="-400" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="960" x2="2560" y2="-320" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1040" x2="2560" y2="-240" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1120" x2="2560" y2="-160" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1200" x2="2560" y2="-80" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1280" x2="2560" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1360" x2="2560" y2="80" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1440" x2="2560" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.1" /><line x1="0" y1="1520" x2="2560" y2="240" stroke="#FFFFFF" stroke-width="2" opacity="0.1" />
      <polygon points="1200,1440 1600,0 1800,0 1400,1440" fill="#C2410C" opacity="0.9" />
      <polygon points="1500,1440 1900,0 2050,0 1650,1440" fill="#C2410C" opacity="0.6" />
      <polygon points="1750,1440 2150,0 2250,0 1850,1440" fill="#C2410C" opacity="0.3" />

      <g transform="translate(240, 720)">
        <text x="0" y="-20" fill="#431407" font-family="Impact, system-ui" font-size="140" font-weight="900" letter-spacing="3px">IRON CORE CLUB</text>
        <text x="0" y="60" fill="#C2410C" font-family="system-ui" font-size="42" font-weight="bold">HARDSTYLE KETTLEBELL FLOWS &amp; HIP POWER CONDITIONING</text>

        <g transform="translate(0, 110)">
          
    <g transform="translate(0, 0) scale(1)">
      <!-- Subscribe Pill Button with Tap Animation -->
      <g class="anim-btn">
        <rect width="280" height="66" rx="33" fill="#E60000" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.32))" />
        <text x="116" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5px" text-anchor="middle">SUBSCRIBE</text>
      </g>

      <!-- Ringing Notification Bell -->
      <g class="anim-bell" transform="translate(225, 33)">
        <path d="M 0 -13 C -5 -13, -8 -8, -8 0 L -11 9 L 11 9 L 8 0 C 8 -8, 5 -13, 0 -13 Z" fill="#FFFFFF" />
        <circle cx="0" cy="12" r="3" fill="#FFFFFF" />
      </g>

      <!-- Animated Clicking Pointer Hand Cursor -->
      <g class="anim-cursor" transform="translate(235, 42)">
        <path d="M 0 0 L 0 28 L 7 21 L 13 33 L 18 30 L 12 18 L 20 18 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.45))" />
      </g>
    </g>
  
        </g>
      </g>
    
</svg>
