<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <style>
      @keyframes cursorClick {
        0%, 100% { transform: translate(235px, 42px) scale(1); }
        38% { transform: translate(230px, 36px) scale(1); }
        46% { transform: translate(228px, 34px) scale(0.85); }
        54% { transform: translate(230px, 36px) scale(1); }
      }
      @keyframes btnTap {
        0%, 100% { transform: scale(1); }
        46% { transform: scale(0.97); }
        54% { transform: scale(1); }
      }
      @keyframes bellWiggle {
        0%, 42%, 68%, 100% { transform: translate(225px, 33px) rotate(0deg); }
        46% { transform: translate(225px, 33px) rotate(-20deg); }
        50% { transform: translate(225px, 33px) rotate(20deg); }
        54% { transform: translate(225px, 33px) rotate(-14deg); }
        58% { transform: translate(225px, 33px) rotate(10deg); }
        62% { transform: translate(225px, 33px) rotate(-4deg); }
      }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px currentColor); }
        50% { opacity: 1; filter: drop-shadow(0 0 26px currentColor); }
      }
      @keyframes floatGently {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes eqBounce1 { 0%, 100% { height: 25px; y: -25px; } 50% { height: 75px; y: -75px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 65px; y: -65px; } 50% { height: 20px; y: -20px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 35px; y: -35px; } 50% { height: 85px; y: -85px; } }
      @keyframes glitchTwitch {
        0%, 88%, 100% { transform: translate(0, 0); }
        90% { transform: translate(-6px, 2px); }
        93% { transform: translate(5px, -2px); }
        96% { transform: translate(-2px, 1px); }
      }
      .anim-cursor { animation: cursorClick 2.6s ease-in-out infinite; transform-origin: 0 0; }
      .anim-btn { animation: btnTap 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-bell { animation: bellWiggle 2.6s ease-in-out infinite; transform-origin: 0 -12px; }
      .anim-glow { animation: neonGlow 2.2s ease-in-out infinite; }
      .anim-float { animation: floatGently 3.5s ease-in-out infinite; }
      .anim-eq1 { animation: eqBounce1 0.8s ease-in-out infinite; }
      .anim-eq2 { animation: eqBounce2 1.1s ease-in-out infinite; }
      .anim-eq3 { animation: eqBounce3 0.9s ease-in-out infinite; }
      .anim-glitch { animation: glitchTwitch 3.5s step-end infinite; }
    </style>
    <linearGradient id="bg-meme-cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    
  </defs>

  <rect width="2560" height="1440" fill="url(#bg-meme-cookie)" />
  
      <!-- Full-Width Horizontal White Safe-Area Ribbon -->
      <rect x="0" y="508.5" width="2560" height="423" fill="#FFFFFF" filter="drop-shadow(0 12px 28px rgba(0,0,0,0.18))" />

      <!-- Decorative Geometric Accents -->
      <g transform="translate(640, 570)">
        <polygon points="0,0 40,25 0,50" fill="#111827" />
        <polygon points="12,6 48,25 12,44" fill="#FB923C" opacity="0.6" />
      </g>
      <g transform="translate(1820, 835)">
        <polygon points="0,20 25,0 25,40" fill="none" stroke="#FB923C" stroke-width="3" />
        <polygon points="20,20 45,0 45,40" fill="none" stroke="#FB923C" stroke-width="3" />
        <polygon points="40,20 65,0 65,40" fill="none" stroke="#FB923C" stroke-width="3" />
      </g>

      <!-- Avatar Photo Frame Overlapping the Ribbon -->
      
    <g transform="translate(880, 720)">
      <defs>
        <clipPath id="av-clip-meme-cookie">
          <circle cx="0" cy="0" r="203" />
        </clipPath>
        <radialGradient id="av-grad-meme-cookie" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#E2E8F0" />
        </radialGradient>
      </defs>

      <!-- Frame Outer Drop Shadow & Ring -->
      <circle cx="0" cy="0" r="210" fill="none" stroke="#FB923C" stroke-width="14" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.32))" />

      <!-- Clipped Portrait -->
      <g clip-path="url(#av-clip-meme-cookie)">
        <!-- Studio Background -->
        <rect x="-210" y="-210" width="420" height="420" fill="url(#av-grad-meme-cookie)" />

        <!-- Torso / Shoulders -->
        <path d="M -193.20000000000002 210 C -157.5 63, -63 25.2, 0 33.6 C 63 25.2, 157.5 63, 193.20000000000002 210 Z" fill="#B45309" />

        <!-- Collar / Neck -->
        <path d="M -46.2 37.8 L 0 75.6 L 46.2 37.8 L 37.8 -10.5 L -37.8 -10.5 Z" fill="#FAD8C0" />

        <!-- Head / Face -->
        <ellipse cx="0" cy="-25.2" rx="73.5" ry="92.4" fill="#FAD8C0" />

        <!-- Hair -->
        <path d="M -79.8 -31.5 C -92.4 -136.5, 92.4 -136.5, 79.8 -31.5 C 71.4 -105, -71.4 -105, -79.8 -31.5 Z" fill="#1A1A1A" />
        <ellipse cx="0" cy="-88.2" rx="71.4" ry="46.2" fill="#1A1A1A" />

        <!-- Eyes -->
        <ellipse cx="-27.3" cy="-29.400000000000002" rx="7.9799999999999995" ry="10.08" fill="#0F172A" />
        <ellipse cx="27.3" cy="-29.400000000000002" rx="7.9799999999999995" ry="10.08" fill="#0F172A" />

        <!-- Friendly Smile -->
        <path d="M -27.3 14.700000000000001 Q 0 35.7 27.3 14.700000000000001" fill="none" stroke="#78350F" stroke-width="5.04" stroke-linecap="round" />

        
          <!-- Glasses -->
          <rect x="-52.5" y="-46.2" width="44.1" height="33.6" rx="8.4" fill="none" stroke="#0F172A" stroke-width="6.72" />
          <rect x="8.4" y="-46.2" width="44.1" height="33.6" rx="8.4" fill="none" stroke="#0F172A" stroke-width="6.72" />
          <line x1="-8.4" y1="-29.400000000000002" x2="8.4" y2="-29.400000000000002" stroke="#0F172A" stroke-width="6.72" />
        
      </g>
    </g>
  

      <!-- Content on Right Side of Ribbon -->
      <g transform="translate(1160, 720)">
        <!-- Kicker Author -->
        <text x="0" y="-80" fill="#4B5563" font-family="Georgia, serif" font-size="28" font-style="italic">Internet Culture</text>

        <!-- Bold Main Title -->
        <text x="0" y="10" fill="#111827" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="2px">COOKIE ARCADE</text>

        <!-- Tagline / Motto -->
        <text x="0" y="60" fill="#6B7280" font-family="Georgia, serif" font-size="28" font-style="italic">DAILY GAMING CLIPS &amp; CHAOTIC HIGHLIGHTS</text>

        <!-- Subscribe Pill Button -->
        <g transform="translate(0, 100)">
          <rect class="anim-btn" width="220" height="52" rx="26" fill="#FB923C" />
          <text x="110" y="33" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing="2px" text-anchor="middle">SUBSCRIBE</text>
        </g>
      </g>
    
</svg>
