<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <style>
      @keyframes cursorClick {
        0%, 100% { transform: translate(235px, 42px) scale(1); }
        38% { transform: translate(230px, 36px) scale(1); }
        46% { transform: translate(228px, 34px) scale(0.85); }
        54% { transform: translate(230px, 36px) scale(1); }
      }
      @keyframes btnTap {
        0%, 100% { transform: scale(1); }
        46% { transform: scale(0.97); }
        54% { transform: scale(1); }
      }
      @keyframes bellWiggle {
        0%, 42%, 68%, 100% { transform: translate(225px, 33px) rotate(0deg); }
        46% { transform: translate(225px, 33px) rotate(-20deg); }
        50% { transform: translate(225px, 33px) rotate(20deg); }
        54% { transform: translate(225px, 33px) rotate(-14deg); }
        58% { transform: translate(225px, 33px) rotate(10deg); }
        62% { transform: translate(225px, 33px) rotate(-4deg); }
      }
      @keyframes neonGlow {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px currentColor); }
        50% { opacity: 1; filter: drop-shadow(0 0 26px currentColor); }
      }
      @keyframes floatGently {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes eqBounce1 { 0%, 100% { height: 25px; y: -25px; } 50% { height: 75px; y: -75px; } }
      @keyframes eqBounce2 { 0%, 100% { height: 65px; y: -65px; } 50% { height: 20px; y: -20px; } }
      @keyframes eqBounce3 { 0%, 100% { height: 35px; y: -35px; } 50% { height: 85px; y: -85px; } }
      @keyframes glitchTwitch {
        0%, 88%, 100% { transform: translate(0, 0); }
        90% { transform: translate(-6px, 2px); }
        93% { transform: translate(5px, -2px); }
        96% { transform: translate(-2px, 1px); }
      }
      .anim-cursor { animation: cursorClick 2.6s ease-in-out infinite; transform-origin: 0 0; }
      .anim-btn { animation: btnTap 2.6s ease-in-out infinite; transform-origin: center; }
      .anim-bell { animation: bellWiggle 2.6s ease-in-out infinite; transform-origin: 0 -12px; }
      .anim-glow { animation: neonGlow 2.2s ease-in-out infinite; }
      .anim-float { animation: floatGently 3.5s ease-in-out infinite; }
      .anim-eq1 { animation: eqBounce1 0.8s ease-in-out infinite; }
      .anim-eq2 { animation: eqBounce2 1.1s ease-in-out infinite; }
      .anim-eq3 { animation: eqBounce3 0.9s ease-in-out infinite; }
      .anim-glitch { animation: glitchTwitch 3.5s step-end infinite; }
    </style>
    <linearGradient id="bg-black-stealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="50%" stop-color="#11111A" />
      <stop offset="100%" stop-color="#1A1A26" />
    </linearGradient>
    
  </defs>

  <rect width="2560" height="1440" fill="url(#bg-black-stealth)" />
  
      <rect x="0" y="0" width="2560" height="4" fill="#DC2626" opacity="0.18" /><rect x="0" y="292" width="2560" height="4" fill="#DC2626" opacity="0.18" /><rect x="0" y="584" width="2560" height="4" fill="#DC2626" opacity="0.18" /><rect x="0" y="876" width="2560" height="4" fill="#DC2626" opacity="0.18" /><rect x="0" y="1168" width="2560" height="4" fill="#DC2626" opacity="0.18" /><rect x="0" y="20" width="2560" height="4" fill="#DC2626" opacity="0.18" />
      <rect x="0" y="0" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1004" y="956" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="2008" y="472" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="452" y="1428" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1456" y="944" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="2460" y="460" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="904" y="1416" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1908" y="932" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="352" y="448" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1356" y="1404" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="2360" y="920" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="804" y="436" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1808" y="1392" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="252" y="908" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1256" y="424" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="2260" y="1380" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="704" y="896" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1708" y="412" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="152" y="1368" width="4" height="4" fill="#FFFFFF" opacity="0.5" /><rect x="1156" y="884" width="4" height="4" fill="#FFFFFF" opacity="0.5" />
      <g class="anim-glitch">
        <text x="1280" y="600" fill="#DC2626" font-family="monospace" font-size="24" text-anchor="middle" letter-spacing="4px">Stealth Gaming</text>
        <text x="1274" y="717" fill="#FF000080" font-family="system-ui" font-size="135" font-weight="900" text-anchor="middle">STEALTH OPS</text>
        <text x="1284" y="722" fill="#00FF0060" font-family="system-ui" font-size="135" font-weight="900" text-anchor="middle">STEALTH OPS</text>
        <text x="1280" y="720" fill="#FFFFFF" font-family="system-ui" font-size="135" font-weight="900" text-anchor="middle">STEALTH OPS</text>
        <text x="1280" y="830" fill="#FFFFFF" font-family="monospace" font-size="32" text-anchor="middle">TACTICAL SHOOTERS • RANKED CLIMB • GUIDES</text>
      </g>

      <g transform="translate(1140, 890)">
        
    <g transform="translate(0, 0) scale(0.95)">
      <!-- Subscribe Pill Button with Tap Animation -->
      <g class="anim-btn">
        <rect width="280" height="66" rx="33" fill="#DC2626" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.32))" />
        <text x="116" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5px" text-anchor="middle">SUBSCRIBE</text>
      </g>

      <!-- Ringing Notification Bell -->
      <g class="anim-bell" transform="translate(225, 33)">
        <path d="M 0 -13 C -5 -13, -8 -8, -8 0 L -11 9 L 11 9 L 8 0 C 8 -8, 5 -13, 0 -13 Z" fill="#FFFFFF" />
        <circle cx="0" cy="12" r="3" fill="#FFFFFF" />
      </g>

      <!-- Animated Clicking Pointer Hand Cursor -->
      <g class="anim-cursor" transform="translate(235, 42)">
        <path d="M 0 0 L 0 28 L 7 21 L 13 33 L 18 30 L 12 18 L 20 18 Z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.45))" />
      </g>
    </g>
  
      </g>
    
</svg>
