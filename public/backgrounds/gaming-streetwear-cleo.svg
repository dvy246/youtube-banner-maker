<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <filter id="soft-plate-shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Muted Background with Linear Grid lines -->
  <rect width="2560" height="1440" fill="#E6E6EC" />
  
  <!-- Subtle Background Grid & Watermark -->
  <g stroke="#D4D4DC" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="360" x2="2560" y2="360" />
    <line x1="0" y1="720" x2="2560" y2="720" />
    <line x1="0" y1="1080" x2="2560" y2="1080" />
  </g>
  <text x="1280" y="860" fill="#DCDBE2" font-family="'Arial Black', Impact, sans-serif" font-size="460" font-weight="900" text-anchor="middle">CLEO</text>

  <!-- Central Frosted Plate Container (Calibrated for Safe Zone) -->
  <g transform="translate(1280, 720)">
    <rect x="-1060" y="-230" width="2120" height="460" rx="36" fill="#F4F4F7" filter="url(#soft-plate-shadow)" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- Cross/Sparkle Decor Accents -->
    <g stroke="#1F2024" stroke-width="3" opacity="0.7">
      <line x1="-960" y1="-170" x2="-960" y2="-150" /><line x1="-970" y1="-160" x2="-950" y2="-160" />
      <line x1="-930" y1="-140" x2="-930" y2="-120" /><line x1="-940" y1="-130" x2="-920" y2="-130" />
      <line x1="120" y1="-180" x2="120" y2="-160" /><line x1="110" y1="-170" x2="130" y2="-170" />
    </g>

    <!-- Left Brand Badge Stack -->
    <g transform="translate(-760, 0)">
      <!-- CODM vertical badge -->
      <rect x="-140" y="-60" width="40" height="120" rx="6" fill="#111113" />
      <text x="-120" y="4" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="900" transform="rotate(-90 -120 4)" letter-spacing="3px">CALL OF DUTY</text>

      <text x="-70" y="-24" fill="#111113" font-family="system-ui" font-size="28" font-weight="900">CLEO CODM</text>
      <text x="-70" y="8" fill="#111113" font-family="system-ui" font-size="24" font-weight="800">ERIKA ESPELETA</text>
      <text x="-70" y="40" fill="#111113" font-family="system-ui" font-size="22" font-weight="800">NU CLEO</text>
    </g>

    <!-- Center Monumental Title -->
    <text x="-60" y="55" fill="#111114" font-family="'Impact', 'Arial Black', sans-serif" font-size="220" font-weight="900" letter-spacing="16px">CLEO</text>

    <!-- Supreme Style Red Box Logo Badge -->
    <g transform="translate(380, -90) rotate(-6)">
      <rect x="-90" y="-24" width="180" height="48" rx="4" fill="#FF0015" />
      <text x="0" y="9" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-size="30" font-weight="bold" text-anchor="middle">Supreme</text>
    </g>

    <!-- Graffiti Hearts & Doodles on Right -->
    <g transform="translate(680, -60)" fill="none" stroke="#111114" stroke-width="4" stroke-linecap="round">
      <path d="M 40 -40 Q 60 -70 80 -40 T 120 -40 Q 140 -10 80 40 Q 20 -10 40 -40 Z" />
      <path d="M 160 0 Q 175 -20 190 0 T 220 0 Q 235 20 190 50 Q 145 20 160 0 Z" />
      <text x="130" y="-70" fill="#111114" stroke="none" font-family="system-ui" font-size="24" font-weight="bold">&lt;3</text>
      <text x="80" y="80" fill="#111114" stroke="none" font-family="system-ui" font-size="28" font-weight="bold">&lt;3</text>
    </g>

    <!-- Circular Avatar Cutout on Bottom-Left -->
    <g transform="translate(-760, 160)">
      <circle cx="0" cy="0" r="110" fill="#FFFFFF" stroke="#E2E2EA" stroke-width="8" filter="url(#soft-plate-shadow)" />
      <circle cx="0" cy="0" r="96" fill="#D8D8E0" />
      <!-- Mini Supreme Box on Avatar -->
      <rect x="-42" y="-12" width="84" height="24" rx="2" fill="#FF0015" />
      <text x="0" y="4" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-size="14" font-weight="bold" text-anchor="middle">Supreme</text>
    </g>
  </g>
</svg>