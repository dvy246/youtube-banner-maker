<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <radialGradient id="matchaGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4E6E58" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#2D4A3E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#182A22" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="oatGlow2" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EED9C4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D4BBA2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#182A22" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="peachGlow3" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#DFA17A" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#A86C48" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#182A22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Zen Forest Floor Base -->
  <rect width="2560" height="1440" fill="#14211B" />

