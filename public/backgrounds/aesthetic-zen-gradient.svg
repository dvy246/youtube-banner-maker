  <rect width="2560" height="1440" fill="url(#matchaGlow1)" />
  <rect width="2560" height="1440" fill="url(#oatGlow2)" />
  <rect width="2560" height="1440" fill="url(#peachGlow3)" />

  <!-- Flowing Aesthetic Zen Waves Across Horizon -->
  <g fill="none" stroke="#FFFFFF" opacity="0.12" stroke-width="1.5">
    <path d="M0 620 Q 640 480, 1280 640 T 2560 600" />
    <path d="M0 660 Q 640 520, 1280 680 T 2560 640" />
    <path d="M0 700 Q 640 560, 1280 720 T 2560 680" />
    <path d="M0 740 Q 640 600, 1280 760 T 2560 720" />
    <path d="M0 780 Q 640 640, 1280 800 T 2560 760" />
  </g>

  <!-- Minimalist Japanese Kanji Symbol for Tranquility (和) Subtle Watermark in Corner -->
  <text x="2420" y="240" font-family="'Inter', sans-serif" font-size="120" font-weight="900" fill="#FFFFFF" fill-opacity="0.04" text-anchor="middle">和</text>
