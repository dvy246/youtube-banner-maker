<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <radialGradient id="studio-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3C3E44" />
      <stop offset="50%" stop-color="#222428" />
      <stop offset="100%" stop-color="#0E0F12" />
    </radialGradient>
    <linearGradient id="city-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D1D5DB" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Vignette Studio Backdrop -->
  <rect width="2560" height="1440" fill="url(#studio-vignette)" />

  <!-- Center 16:9 Safe Area Band -->
  <rect y="508" width="2560" height="424" fill="#E8EAED" />

  <!-- Misty City Skyline Silhouette -->
  <g fill="url(#city-grad)" opacity="0.6">
    <!-- Buildings silhouette skyline -->
    <rect x="200" y="600" width="60" height="332" />
    <rect x="270" y="560" width="90" height="372" />
    <polygon points="315,510 300,560 330,560" />
    <rect x="380" y="620" width="80" height="312" />
    <rect x="480" y="580" width="70" height="352" />
    
    <rect x="800" y="590" width="100" height="342" />
    <rect x="920" y="540" width="80" height="392" />
    <polygon points="960,490 945,540 975,540" />
    
    <rect x="1560" y="550" width="90" height="382" />
    <rect x="1670" y="600" width="70" height="332" />
    <rect x="2100" y="580" width="120" height="352" />
    <polygon points="2160,520 2140,580 2180,580" />
    <rect x="2240" y="610" width="80" height="322" />
  </g>

  <!-- Bokeh Soft Star Crosses -->
  <g fill="#9CA3AF" opacity="0.4">
    <polygon points="280,680 286,686 280,692 274,686" />
    <polygon points="420,800 428,808 420,816 412,808" />
    <polygon points="2140,680 2148,688 2140,696 2132,688" />
    <polygon points="2280,820 2290,830 2280,840 2270,830" />
  </g>

  <!-- Central Monumental Typography "THE PROFESSIONAL VIDEOGRAPHER" -->
  <g transform="translate(1280, 720)">
    <text x="-480" y="-55" fill="#2E3035" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4px">THE</text>
    <text x="0" y="35" fill="#2B2D32" font-family="'Arial Black', Impact, sans-serif" font-size="140" font-weight="900" letter-spacing="8px" text-anchor="middle">PROFESSIONAL</text>
    <text x="440" y="85" fill="#3D4046" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="6px" text-anchor="end">VIDEOGRAPHER</text>
  </g>

  <!-- Left Callout: NEW VIDEO EVERY FRIDAY -->
  <g transform="translate(360, 720)">
    <polygon points="-8,-14 12,0 -8,14" fill="#1F2124" />
    <text x="24" y="-4" fill="#1F2124" font-family="system-ui" font-size="16" font-weight="900" letter-spacing="2px">NEW VIDEO</text>
    <text x="24" y="16" fill="#1F2124" font-family="system-ui" font-size="14" font-weight="800" letter-spacing="2px">EVERY FRIDAY</text>
  </g>

  <!-- Right Callout: SUBSCRIBE AND NOTIFICATION -->
  <g transform="translate(2200, 720)">
    <text x="0" y="-6" fill="#1F2124" font-family="system-ui" font-size="16" font-weight="900" letter-spacing="2px" text-anchor="end">SUBSCRIBE</text>
    <text x="0" y="14" fill="#4B5563" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="end">AND TURN ON NOTIFICATION 🔔</text>
  </g>
</svg>