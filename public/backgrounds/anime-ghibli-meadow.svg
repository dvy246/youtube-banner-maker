<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="ghibliSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B609E" />
      <stop offset="35%" stop-color="#3A8BD4" />
      <stop offset="70%" stop-color="#72B7F5" />
      <stop offset="90%" stop-color="#BFE0FF" />
      <stop offset="100%" stop-color="#FFF5E5" />
    </linearGradient>
    <linearGradient id="cloudWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#DFEEFA" />
    </linearGradient>
    <linearGradient id="cloudShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CADDF0" />
      <stop offset="100%" stop-color="#9EBBD8" />
    </linearGradient>
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B9A7D" />
      <stop offset="100%" stop-color="#2D6B55" />
    </linearGradient>
    <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#328358" />
      <stop offset="100%" stop-color="#1D5335" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="2560" height="1440" fill="url(#ghibliSky)" />

  <!-- Sun Rays Flare -->
  <circle cx="520" cy="380" r="350" fill="#FFF9E6" fill-opacity="0.25" />
  <circle cx="520" cy="380" r="160" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Voluminous Studio Ghibli Summer Cumulus Cloud Formations -->
  <!-- Cloud 1: Majestic Center-Right Tower -->
  <g opacity="0.95">
    <ellipse cx="1780" cy="620" rx="340" ry="240" fill="url(#cloudShadow)" />
    <ellipse cx="1520" cy="660" rx="260" ry="200" fill="url(#cloudShadow)" />
    <ellipse cx="2040" cy="680" rx="280" ry="220" fill="url(#cloudShadow)" />
    <!-- White tops -->
    <ellipse cx="1750" cy="560" rx="300" ry="210" fill="url(#cloudWhite)" />
    <ellipse cx="1560" cy="520" rx="220" ry="180" fill="url(#cloudWhite)" />
    <ellipse cx="1880" cy="480" rx="200" ry="170" fill="url(#cloudWhite)" />
    <ellipse cx="1700" cy="420" rx="160" ry="140" fill="#FFFFFF" />
    <ellipse cx="1820" cy="410" rx="150" ry="130" fill="#FFFFFF" />
  </g>

  <!-- Cloud 2: Gentle Horizon Clouds Left -->
  <g opacity="0.9">
    <ellipse cx="480" cy="820" rx="320" ry="180" fill="url(#cloudShadow)" />
    <ellipse cx="220" cy="850" rx="240" ry="160" fill="url(#cloudShadow)" />
    <ellipse cx="440" cy="760" rx="280" ry="160" fill="url(#cloudWhite)" />
    <ellipse cx="280" cy="730" rx="220" ry="140" fill="#FFFFFF" />
  </g>

  <!-- Far Green Rolling Hills -->
  <path d="M0 980 Q 580 880, 1180 940 T 2560 920 L 2560 1440 L 0 1440 Z" fill="url(#hillFar)" />
  <path d="M0 1060 Q 820 960, 1640 1010 T 2560 980 L 2560 1440 L 0 1440 Z" fill="url(#hillNear)" />

  <!-- Anime Wind Turbine Silhouettes in Distance -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.8" fill="none">
    <line x1="880" y1="910" x2="880" y2="810" />
    <line x1="880" y1="810" x2="830" y2="780" />
    <line x1="880" y1="810" x2="930" y2="780" />
    <line x1="880" y1="810" x2="880" y2="860" />

    <line x1="1020" y1="925" x2="1020" y2="835" stroke-width="2.5" />
    <line x1="1020" y1="835" x2="980" y2="810" stroke-width="2.5" />
    <line x1="1020" y1="835" x2="1060" y2="810" stroke-width="2.5" />
  </g>

  <!-- Distant Birds Silhouette -->
  <g stroke="#1A4064" stroke-width="3" fill="none" opacity="0.6">
    <path d="M980 440 Q 995 425, 1010 440 Q 1025 425, 1040 440" />
    <path d="M1060 480 Q 1072 468, 1084 480 Q 1096 468, 1108 480" stroke-width="2" />
    <path d="M940 470 Q 950 460, 960 470 Q 970 460, 980 470" stroke-width="2" />
  </g>
</svg>
